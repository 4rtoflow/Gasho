# Publishes gasho-daemon to GitHub Packages as @4rtoflow/gasho-daemon when a tag daemon-v<version> is pushed.
# The tag must match DAEMON_VERSION in apps/daemon/src/daemon.ts.
name: Publish gasho-daemon

on:
  push:
    tags: ["daemon-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@4rtoflow"
      - run: npm ci
      - run: npm run typecheck
      - run: node --test --disable-warning=ExperimentalWarning "apps/daemon/test/*.test.ts"
      - name: Check the tag against DAEMON_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^export const DAEMON_VERSION = "\(.*\)";$/\1/p' apps/daemon/src/daemon.ts)
          test "daemon-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match DAEMON_VERSION $version"; exit 1; }
      - run: node apps/daemon/scripts/pack.ts
      - run: npm publish apps/daemon/dist/package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
