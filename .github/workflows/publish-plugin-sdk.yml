# Publishes the plugin SDK to GitHub Packages as @4rtoflow/gasho-plugin-sdk when a tag plugin-sdk-v<version> is pushed.
# The tag must match the version in packages/plugin-sdk/package.json.
name: Publish the plugin SDK

on:
  push:
    tags: ["plugin-sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@4rtoflow"
      - run: npm ci
      - run: npm run typecheck
      - name: Check the tag against the SDK's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p 'require("./packages/plugin-sdk/package.json").version')
          test "plugin-sdk-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match the SDK's version $version"; exit 1; }
      - run: node packages/plugin-sdk/scripts/pack.ts
      - run: npm publish packages/plugin-sdk/dist/package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
